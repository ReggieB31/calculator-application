<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>calculator-application</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div id="calc"> 
    <div id="screen">
      <h1 id="input"></h1> 
    </div>

    <div id="number-buttons">
    <button class="button number" data-value="1" onClick="calculate(event)">1</button>
    <button class="button number" data-value="2" onClick="calculate(event)">2</button>
    <button class="button number" data-value="3" onClick="calculate(event)">3</button>
    <button class="button number" data-value="4" onClick="calculate(event)">4</button>
    <button class="button number" data-value="5" onClick="calculate(event)">5</button>
    <button class="button number" data-value="6" onClick="calculate(event)">6</button>
    <button class="button number" data-value="7" onClick="calculate(event)">7</button>
    <button class="button number" data-value="8" onClick="calculate(event)">8</button>
    <button class="button number" data-value="9" onClick="calculate(event)">9</button>
    <button class="button number" data-value="0" onClick="calculate(event)">0</button>
    <button class="button number" data-value="." onClick="calculate(event)">.</button>
    <button class="button number clear" data-value="clear" onClick="calculate(event)">clear</button>
    </div>

    <div id="operation-buttons">
      <button class="button operation" data-value="+" onClick="calculate(event)">+</button>
      <button class="button operation" data-value="-" onClick="calculate(event)">-</button>
      <button class="button operation" data-value="*" onClick="calculate(event)">*</button>
      <button class="button operation" data-value="/" onClick="calculate(event)">/</button>
      <button class="button operation" data-value="^" onClick="calculate(event)">^</button>
      <button class="button operation" data-value="=" onClick="calculate(event)">=</button>
    </div>
</div>
  <script src="main.js"></script>
</body>
</html>
